[build]
  # NEXT_PUBLIC_ENGINE_VERSION stamps every engine asset URL with this deploy's
  # commit SHA (see app/engineAssets.ts), and stamp-engine-assets.mjs copies the
  # assets to the matching public/e/<sha>/ path. Netlify sets COMMIT_REF for us;
  # when it's absent (a plain local `next build`) both steps no-op and assets
  # stay at their bare paths, which is exactly the old behaviour.
  command = "export NEXT_PUBLIC_ENGINE_VERSION=$COMMIT_REF && node scripts/stamp-engine-assets.mjs && next build"
  publish = ".next"

[build.environment]
  # @netlify/plugin-nextjs requires Node 22+.
  NODE_VERSION = "22"

# The compose worker (netlify/functions/compose-background.mjs) reads the
# compose skill at runtime through a path it builds itself, which the function
# bundler cannot see by following imports -- so it has to be named, exactly as
# next.config.mjs names it for the Next route that runs the same loop under
# `next dev`. Without this the worker falls back to composing without its
# guide, which costs taste rather than failing outright.
[functions]
  included_files = [".claude/skills/compose/SKILL.md"]

# Next.js runtime for Netlify: builds the App Router app, serves public/ static
# assets (the engine: /js/*, /woscillators.js, /style.css, etc.) at web root, and
# routes App Router route handlers (e.g. /api/share) to Netlify Functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Versioned engine assets
#
# The engine is 33 unbundled ES modules plus woscillators.js and style.css, all
# served from public/ at stable paths. That combination made long caching unsafe:
# a browser could pair a fresh main.js with a stale voices.js after a deploy, and
# a 33-module engine is the worst possible place for that kind of version skew.
# So everything was `max-age=0, must-revalidate`, and every repeat visit paid
# ~35 revalidation round trips before the engine could boot.
#
# The build now also publishes those assets under /e/<commit-sha>/, giving each
# deploy its own URL namespace over identical bytes. A page load can only ever
# mix assets from one deploy, so skew is unrepresentable — which is what makes
# `immutable` safe here. A new deploy means new URLs, so nothing has to expire,
# and repeat visits within a deploy make zero requests.
#
# Bare /js/* etc. are still published and keep Netlify's default
# revalidate-always headers, so anything loading unversioned URLs can't get
# stuck on a stale copy for a year.
#
# Capitalised to match the casing @netlify/plugin-nextjs uses for static assets.
# Netlify dedupes header names case-sensitively, so a lowercase `cache-control`
# here is a second, distinct key — it warns at build time and leaves which one
# wins up to the merge order rather than to us.
[[headers]]
  for = "/e/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
