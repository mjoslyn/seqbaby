<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>seqbaby</title>
  <meta name="description" content="Prompt-driven step sequencer in the browser: Plaits, 808/909/303, samples, MIDI out, Eleven-Labs prompted voices." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />

  <!-- social share card -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="seqbaby" />
  <meta property="og:description" content="Prompt-driven step sequencer — Plaits, 808/909/303, samples, MIDI, Eleven-Labs." />
  <meta property="og:url" content="https://seqbaby.netlify.app/" />
  <meta property="og:image" content="https://seqbaby.netlify.app/share.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="seqbaby" />
  <meta name="twitter:description" content="Prompt-driven step sequencer — Plaits, 808/909/303, samples, MIDI, Eleven-Labs." />
  <meta name="twitter:image" content="https://seqbaby.netlify.app/share.png" />
</head>
<body>
  <header class="transport">
    <div class="logo" title="seqbaby">
      <img src="/favicon.svg" alt="" />
      <span>seqbaby</span>
    </div>
    <button id="play" class="play">play</button>
    <div class="field"><label for="bpm">bpm</label><input id="bpm" type="number" value="110" min="40" max="240" /></div>
    <div class="field"><label for="swing">swing</label><input id="swing" type="range" min="0" max="0.5" step="0.01" value="0" /></div>
    <div class="scale-field">
      <label class="scale-toggle"><input id="scale-on" type="checkbox" /> scale</label>
      <select id="scale-root"></select>
      <select id="scale-mode"></select>
      <button id="note-colors" class="ghost icon-btn" aria-pressed="false" aria-label="note colors" title="toggle diatonic note coloring on the piano roll + step grid"></button>
    </div>
    <button id="add-track" class="ghost">add track</button>
    <div class="spacer"></div>
    <button id="metronome" class="ghost icon-btn" aria-pressed="false" aria-label="metronome" title="metronome click on the downbeat"></button>
    <svg id="beat-indicator" class="beat-indicator" viewBox="-22 -22 44 44" width="40" height="40" aria-hidden="true"></svg>
    <div class="meter master-meter" title="master output level"><div class="meter-bar"></div></div>
    <div id="status" class="status">click play to unlock audio</div>
  </header>

  <div class="pattern-bar">
    <button id="set-share" title="create a shareable link for this session">Share</button>
    <button id="pattern-menu-btn" class="mobile-only" type="button" aria-label="session menu" title="open session menu">Session</button>
    <div class="set-stack">
      <button id="set-new" class="ghost" title="start a fresh session (replaces the current one)">New</button>
      <button id="set-save" class="ghost" title="save the current session">Save</button>
      <button id="set-load" class="ghost" title="load a saved session">Load</button>
    </div>
    <div class="set-stack">
      <button id="set-export" class="ghost" title="download the current session as a json file">Export</button>
      <button id="set-import" class="ghost" title="load a session from a json file">Import</button>
    </div>
    <div class="set-stack">
      <button id="bounce-audio" class="ghost dl-btn" title="render the current pattern to audio and download it"><span class="dl-icon"></span><span class="dl-label">Pattern</span></button>
      <button id="bounce-track" class="ghost dl-btn" title="chain through all non-empty patterns and render the whole arrangement"><span class="dl-icon"></span><span class="dl-label">Session</span></button>
    </div>
    <div class="mode-stack">
      <div class="mode-row">
        <button id="pattern-mode" class="ghost icon-btn" aria-pressed="false" aria-label="pattern mode"></button>
        <button id="pattern-switch" class="ghost icon-btn" aria-pressed="false" aria-label="switch mode"></button>
      </div>
      <button id="pattern-dup" class="ghost" title="duplicate current pattern into the next slot">dup</button>
    </div>
    <label class="repeat-wrap" title="time signature for this pattern"><span>sig</span><select id="pattern-meter">
      <option value="4/4" selected>4/4</option>
      <option value="3/4">3/4</option>
      <option value="2/4">2/4</option>
      <option value="6/8">6/8</option>
      <option value="9/8">9/8</option>
      <option value="12/8">12/8</option>
      <option value="5/4">5/4</option>
      <option value="7/4">7/4</option>
      <option value="5/8">5/8</option>
      <option value="7/8">7/8</option>
    </select></label>
    <label class="repeat-wrap" title="bars this pattern plays for before chain advances"><span>rep</span><input id="pattern-repeats" type="number" min="1" max="16" value="1" /></label>
    <div id="pattern-grid" class="pattern-grid"></div>
  </div>

  <main id="tracks"></main>

  <template id="track-template">
    <section class="track">
      <div class="track-head">
        <input class="track-name" type="text" placeholder="track" />
        <select class="track-engine"></select>
        <button class="track-save icon-btn ghost" aria-label="save patch" title="save the current custom patch"></button>
        <button class="track-load-patch icon-btn ghost" aria-label="load patch" title="load a saved patch into this track"></button>
        <div class="field"><label>len</label><input class="track-len" type="number" min="1" max="128" value="16" /></div>
        <div class="track-len-extend">
          <button class="track-len-plus1 ghost" type="button" title="add one bar to this track's pattern (duplicates existing content)">+1</button>
          <button class="track-len-2x ghost" type="button" title="double this track's pattern length (duplicates content)">x2</button>
          <button class="track-len-4x ghost" type="button" title="quadruple this track's pattern length (duplicates content)">x4</button>
          <button class="track-len-half ghost" type="button" title="halve this track's pattern length (truncates to the first half)">/2</button>
          <button class="track-len-quarter ghost" type="button" title="quarter this track's pattern length (truncates to the first quarter)">/4</button>
        </div>
        <div class="field"><label>spd</label>
          <select class="track-speed">
            <option value="0.0625">1/16</option>
            <option value="0.125">1/8</option>
            <option value="0.25">1/4</option>
            <option value="0.5">1/2</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="16">16</option>
          </select>
        </div>
        <div class="field vol-field"><label>vol</label>
          <div class="vol-combo" title="volume (drag) + output level">
            <div class="meter track-meter"><div class="meter-bar"></div></div>
            <input class="p-vol" type="range" min="0" max="1" step="0.01" value="0.8" />
          </div>
        </div>
        <div class="track-synth-row">
        <div class="param-group timbre-group">
          <div class="field"><label>harm</label><input class="p-harm" type="range" min="0" max="1" step="0.01" value="0.5" /></div>
          <div class="field"><label>timb</label><input class="p-timb" type="range" min="0" max="1" step="0.01" value="0.5" /></div>
          <div class="field"><label>morph</label><input class="p-morph" type="range" min="0" max="1" step="0.01" value="0.5" /></div>
          <div class="field"><label>decay</label><input class="p-decay" type="range" min="0" max="1" step="0.01" value="0.4" /></div>
          <button class="track-rand ghost" title="randomize harm/timb/morph/decay">rand</button>
        </div>
        <div class="param-group osc-mix-group" hidden>
          <div class="field"><label class="osc1-label">osc1</label><input class="p-osc1" type="range" min="0" max="1" step="0.01" value="0.55" /></div>
          <div class="field"><label class="osc2-label">osc2</label><input class="p-osc2" type="range" min="0" max="1" step="0.01" value="0.45" /></div>
          <div class="field"><label class="osc3-label">osc3</label><input class="p-osc3" type="range" min="0" max="1" step="0.01" value="0.35" /></div>
          <div class="field osc4-field"><label class="osc4-label">sub</label><input class="p-osc4" type="range" min="0" max="1" step="0.01" value="0.4" /></div>
        </div>
        <div class="param-group osc-mod-group" hidden>
          <div class="field"><label>ultra</label><input class="p-ultra" type="range" min="0" max="1" step="0.01" value="0.35" /></div>
          <div class="field"><label>fm</label><input class="p-fm" type="range" min="0" max="1" step="0.01" value="0" /></div>
          <div class="field"><label>metal</label><input class="p-metal" type="range" min="0" max="1" step="0.01" value="0" /></div>
        </div>
        <div class="param-group moog-osc-group" hidden>
          <div class="moog-osc-row">
            <span class="moog-osc-lbl">osc1</span>
            <select class="p-osc1range" title="range / octave">
              <option value="-2">32'</option><option value="-1">16'</option><option value="0" selected>8'</option><option value="1">4'</option><option value="2">2'</option>
            </select>
            <select class="p-osc1wave" title="waveform">
              <option value="triangle">tri</option><option value="sawtooth" selected>saw</option><option value="square">sqr</option><option value="sine">sin</option>
            </select>
          </div>
          <div class="moog-osc-row">
            <span class="moog-osc-lbl">osc2</span>
            <label class="moog-freq"><span>freq</span><input class="p-osc2freq" type="range" min="-7" max="7" step="1" value="0" /></label>
            <select class="p-osc2range" title="range / octave">
              <option value="-2">32'</option><option value="-1">16'</option><option value="0" selected>8'</option><option value="1">4'</option><option value="2">2'</option>
            </select>
            <select class="p-osc2wave" title="waveform">
              <option value="triangle">tri</option><option value="sawtooth" selected>saw</option><option value="square">sqr</option><option value="sine">sin</option>
            </select>
          </div>
          <div class="moog-osc-row">
            <span class="moog-osc-lbl">osc3</span>
            <label class="moog-freq"><span>freq</span><input class="p-osc3freq" type="range" min="-7" max="7" step="1" value="0" /></label>
            <select class="p-osc3range" title="range / octave">
              <option value="-2">32'</option><option value="-1" selected>16'</option><option value="0">8'</option><option value="1">4'</option><option value="2">2'</option>
            </select>
            <select class="p-osc3wave" title="waveform">
              <option value="triangle" selected>tri</option><option value="sawtooth">saw</option><option value="square">sqr</option><option value="sine">sin</option>
            </select>
          </div>
          <div class="field moog-noise">
            <label>noise</label><input class="p-noise" type="range" min="0" max="1" step="0.01" value="0" />
            <select class="p-noisetype" title="noise color">
              <option value="white" selected>white</option><option value="pink">pink</option>
            </select>
          </div>
        </div>
        </div><!-- /track-synth-row -->
        <button class="track-solo ghost" aria-pressed="false" title="solo">solo</button>
        <button class="track-mute ghost">mute</button>
        <button class="track-note-mode ghost" aria-pressed="true" title="gate plays the full step length; trigger fires a short hit">gate</button>
        <button class="track-clear ghost">clear</button>
        <button class="track-dice icon-btn ghost" type="button" aria-label="random melody" title="random melody (replaces this pattern)"></button>
        <button class="track-dup ghost" type="button" title="duplicate this track">dup</button>
        <button class="track-remove ghost danger">remove</button>
        <div class="track-oct">
          <button class="track-oct-down ghost" type="button" title="shift every step down an octave">oct −</button>
          <button class="track-oct-up ghost" type="button" title="shift every step up an octave">oct +</button>
          <button class="track-semi-down ghost" type="button" title="shift every step down a semitone">semi −</button>
          <button class="track-semi-up ghost" type="button" title="shift every step up a semitone">semi +</button>
        </div>
        <div class="panel-btn-group">
          <button class="track-roll ghost" aria-pressed="false" title="piano roll: click cells to place notes per step">roll</button>
          <button class="track-filter ghost" aria-pressed="false" title="filter">filter</button>
          <button class="track-env ghost" aria-pressed="false" title="envelope → cutoff">env</button>
          <button class="track-fx ghost" aria-pressed="false" title="fx rack">fx</button>
          <button class="track-eq ghost" aria-pressed="false" title="3-band eq">eq</button>
          <button class="track-comp ghost" aria-pressed="false" title="compressor + sidechain">comp</button>
          <button class="track-mod ghost" aria-pressed="false">mod</button>
          <button class="track-aut ghost" aria-pressed="false" title="per-step automation">aut</button>
        </div>
      </div>
      <div class="track-midi field" hidden>
        <label>midi out</label>
        <select class="midi-out"></select>
        <label>ch</label>
        <input class="midi-ch" type="number" min="1" max="16" value="1" />
      </div>
      <div class="track-mod-panel" hidden></div>
      <div class="track-aut-panel" hidden></div>
      <div class="track-roll-panel" hidden></div>
      <div class="track-filter-panel" hidden>
        <div class="fx-row" data-fx="filter">
          <span class="fx-title">filter (resonant lp)</span>
          <label class="fx-ctl"><span>cut</span><input class="p-cutoff" type="range" min="0" max="1" step="0.001" value="1" /></label>
          <label class="fx-ctl"><span>res</span><input class="p-reson" type="range" min="0" max="1" step="0.01" value="0" /></label>
        </div>
      </div>
      <div class="track-env-panel" hidden>
        <div class="fx-row" data-fx="env">
          <span class="fx-title">envelope (adsr → cutoff)</span>
          <label class="fx-ctl"><span>env</span><input class="p-envamt" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>A</span><input class="p-envatk" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>D</span><input class="p-envdec" type="range" min="0" max="1" step="0.01" value="0.25" /></label>
          <label class="fx-ctl"><span>S</span><input class="p-envsus" type="range" min="0" max="1" step="0.01" value="0.4" /></label>
          <label class="fx-ctl"><span>R</span><input class="p-envrel" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
        </div>
      </div>
      <div class="track-eq-panel" hidden>
        <div class="fx-row" data-fx="eq">
          <span class="fx-title">eq (3-band)</span>
          <label class="fx-ctl"><span>low</span><input class="p-eq-low" type="range" min="-18" max="18" step="0.5" value="0" /></label>
          <label class="fx-ctl"><span>mid</span><input class="p-eq-mid" type="range" min="-18" max="18" step="0.5" value="0" /></label>
          <label class="fx-ctl"><span>high</span><input class="p-eq-high" type="range" min="-18" max="18" step="0.5" value="0" /></label>
        </div>
      </div>
      <div class="track-comp-panel" hidden>
        <div class="fx-row" data-fx="comp">
          <span class="fx-title">compressor</span>
          <label class="fx-ctl"><span>on</span><input class="comp-enabled" type="checkbox" /></label>
          <label class="fx-ctl"><span>src</span><select class="comp-source"><option value="self">self</option></select></label>
        </div>
        <div class="fx-row" data-fx="comp">
          <span class="fx-title"></span>
          <label class="fx-ctl"><span>thr</span><input class="comp-threshold" type="range" min="-60" max="0" step="1" value="-20" /></label>
          <label class="fx-ctl"><span>ratio</span><input class="comp-ratio" type="range" min="1" max="20" step="0.1" value="4" /></label>
          <label class="fx-ctl"><span>atk</span><input class="comp-attack" type="range" min="0" max="1" step="0.005" value="0.01" /></label>
          <label class="fx-ctl"><span>rel</span><input class="comp-release" type="range" min="0.02" max="2" step="0.01" value="0.2" /></label>
          <label class="fx-ctl"><span>knee</span><input class="comp-knee" type="range" min="0" max="30" step="1" value="6" /></label>
        </div>
      </div>
      <div class="track-fx-panel" hidden>
        <div class="fx-row" data-fx="vinyl">
          <span class="fx-title">vinyl sim</span>
          <label class="fx-ctl"><span>amt</span><input class="fx-vinyl-amount" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>warmth</span><input class="fx-vinyl-warmth" type="range" min="0" max="1" step="0.01" value="0.4" /></label>
          <label class="fx-ctl"><span>wow</span><input class="fx-vinyl-wow" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
        </div>
        <div class="fx-row" data-fx="cassette">
          <span class="fx-title">cassette</span>
          <label class="fx-ctl"><span>amt</span><input class="fx-cassette-amount" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>flutter</span><input class="fx-cassette-flutter" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
          <label class="fx-ctl"><span>sat</span><input class="fx-cassette-sat" type="range" min="0" max="1" step="0.01" value="0.4" /></label>
        </div>
        <div class="fx-row" data-fx="fuzz">
          <span class="fx-title">fuzz (dba-style)</span>
          <label class="fx-ctl"><span>amt</span><input class="fx-fuzz-amount" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>drive</span><input class="fx-fuzz-drive" type="range" min="0" max="1" step="0.01" value="0.7" /></label>
          <label class="fx-ctl"><span>tone</span><input class="fx-fuzz-tone" type="range" min="0" max="1" step="0.01" value="0.4" /></label>
          <label class="fx-ctl"><span>level</span><input class="fx-fuzz-level" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
        </div>
        <div class="fx-row" data-fx="ringmod">
          <span class="fx-title">ring mod</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-ringmod-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>freq</span><input class="fx-ringmod-freq" type="range" min="0" max="1" step="0.01" value="0.35" /></label>
        </div>
        <div class="fx-row" data-fx="shaper">
          <span class="fx-title">wave shaper</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-shaper-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>pre</span><input class="fx-shaper-preamp" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
          <label class="fx-ctl"><span>amt</span><input class="fx-shaper-amt" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
          <label class="fx-ctl"><span>mode</span><select class="fx-shaper-mode">
            <option value="saturate">saturate</option>
            <option value="softclip">soft clip</option>
            <option value="clip">clip</option>
            <option value="serge">serge</option>
            <option value="fold" selected>fold</option>
            <option value="wrap">wrap</option>
          </select></label>
        </div>
        <div class="fx-row" data-fx="crush">
          <span class="fx-title">bitcrush</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-crush-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>bits</span><input class="fx-crush-bits" type="range" min="1" max="16" step="1" value="8" /></label>
        </div>
        <div class="fx-row" data-fx="autowah">
          <span class="fx-title">auto-wah</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-autowah-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>sens</span><input class="fx-autowah-sens" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
          <label class="fx-ctl"><span>range</span><input class="fx-autowah-range" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
        </div>
        <div class="fx-row" data-fx="chorus">
          <span class="fx-title">chorus</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-chorus-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>rate</span><input class="fx-chorus-rate" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
          <label class="fx-ctl"><span>depth</span><input class="fx-chorus-depth" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
        </div>
        <div class="fx-row" data-fx="phaser">
          <span class="fx-title">phaser</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-phaser-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>rate</span><input class="fx-phaser-rate" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
          <label class="fx-ctl"><span>depth</span><input class="fx-phaser-depth" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
        </div>
        <div class="fx-row" data-fx="flanger">
          <span class="fx-title">flanger</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-flanger-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>rate</span><input class="fx-flanger-rate" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
          <label class="fx-ctl"><span>fbk</span><input class="fx-flanger-fbk" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
        </div>
        <div class="fx-row" data-fx="pitchshift">
          <span class="fx-title">pitch shift</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-pitchshift-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>semi</span><input class="fx-pitchshift-semi" type="range" min="-12" max="12" step="1" value="0" /></label>
        </div>
        <div class="fx-row" data-fx="delay">
          <span class="fx-title">delay</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-delay-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>time</span><input class="fx-delay-time" type="range" min="0.05" max="1" step="0.005" value="0.375" /></label>
          <label class="fx-ctl"><span>fbk</span><input class="fx-delay-fbk" type="range" min="0" max="0.95" step="0.01" value="0.35" /></label>
          <label class="fx-ctl fx-sync-wrap"><input class="fx-delay-sync" type="checkbox" /><span>sync</span></label>
          <select class="fx-delay-div">
            <option value="1">1/4</option>
            <option value="0.5">1/8</option>
            <option value="0.75">1/8d</option>
            <option value="0.333">1/8t</option>
            <option value="0.25">1/16</option>
            <option value="0.125">1/32</option>
          </select>
        </div>
        <div class="fx-row" data-fx="reverb">
          <span class="fx-title">reverb</span>
          <label class="fx-ctl"><span>wet</span><input class="fx-reverb-wet" type="range" min="0" max="1" step="0.01" value="0" /></label>
          <label class="fx-ctl"><span>decay</span><input class="fx-reverb-decay" type="range" min="0.2" max="8" step="0.1" value="2" /></label>
        </div>
      </div>
      <div class="steps"></div>
    </section>
  </template>

  <template id="lfo-row-template">
    <div class="lfo-row">
      <label class="lfo-target"></label>
      <label class="lfo-enable">
        <input type="checkbox" class="lfo-on" />
        on
      </label>
      <select class="lfo-shape">
        <option value="sine">sine</option>
        <option value="triangle">triangle</option>
        <option value="sawtooth">saw</option>
        <option value="square">square</option>
      </select>
      <label class="lfo-sync-wrap">
        <input type="checkbox" class="lfo-sync" />
        sync
      </label>
      <div class="field lfo-rate-field">
        <label>rate</label>
        <input class="lfo-rate" type="range" min="0" max="1" step="0.001" value="0.35" />
        <select class="lfo-div">
          <option value="16">4 bars</option>
          <option value="8">2 bars</option>
          <option value="4">1 bar</option>
          <option value="2">1/2</option>
          <option value="1" selected>1/4 (beat)</option>
          <option value="0.5">1/8</option>
          <option value="0.25">1/16</option>
          <option value="0.125">1/32</option>
        </select>
        <span class="lfo-rate-label">1.00 hz</span>
      </div>
      <div class="field">
        <label>depth</label>
        <input class="lfo-depth" type="range" min="0" max="1" step="0.01" value="0.5" />
        <span class="lfo-depth-label">0.50</span>
      </div>
      <button class="lfo-remove ghost" type="button" title="remove this modulation">×</button>
    </div>
  </template>

  <!-- iOS audio session unlock: play() on this element inside a user gesture
       switches Safari from "ambient" (ringer-controlled, silenced when the
       side switch is on silent) to "playback" mode, which routes AudioContext
       output through the regular media volume and ignores the ringer switch.
       The element loops a 1-second silent WAV generated at runtime (see
       initSilentAudioLoop in app.js) — looping keeps the audio session
       continuously active, which prevents iOS from quietly deactivating the
       renderer between the unlock tap and the first transport hit. Without an
       active session, ctx.state reads "running" but no samples are emitted
       until something forces a session re-eval (e.g., tab switch). -->
  <audio id="ios-audio-unlock" playsinline preload="auto" loop></audio>
  <script src="https://cdn.jsdelivr.net/npm/tone@15.0.4/build/Tone.js"></script>
  <script src="/woscillators.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
