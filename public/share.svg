<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" shape-rendering="geometricPrecision">
  <!-- background -->
  <rect width="1200" height="630" fill="#0e0f12"/>

  <!-- subtle sequencer grid dots -->
  <g opacity="0.07" fill="#c2f04a">
    <g>
      <circle cx="60"   cy="60" r="3"/><circle cx="120"  cy="60" r="3"/><circle cx="180"  cy="60" r="3"/>
      <circle cx="240"  cy="60" r="3"/><circle cx="300"  cy="60" r="3"/><circle cx="360"  cy="60" r="3"/>
      <circle cx="420"  cy="60" r="3"/><circle cx="480"  cy="60" r="3"/><circle cx="540"  cy="60" r="3"/>
      <circle cx="600"  cy="60" r="3"/><circle cx="660"  cy="60" r="3"/><circle cx="720"  cy="60" r="3"/>
      <circle cx="780"  cy="60" r="3"/><circle cx="840"  cy="60" r="3"/><circle cx="900"  cy="60" r="3"/>
      <circle cx="960"  cy="60" r="3"/><circle cx="1020" cy="60" r="3"/><circle cx="1080" cy="60" r="3"/>
      <circle cx="1140" cy="60" r="3"/>
    </g>
  </g>

  <!-- synth baby (scaled up from favicon) -->
  <g transform="translate(80 120) scale(6)">
    <path d="M10 22 Q32 0 54 22" stroke="#e8e6df" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="6" y="20" width="8" height="14" rx="3" fill="#e8e6df"/>
    <rect x="50" y="20" width="8" height="14" rx="3" fill="#e8e6df"/>
    <rect x="10" y="18" width="44" height="40" rx="9" fill="#ff6fa3" stroke="#d94f87" stroke-width="1.5"/>
    <rect x="18" y="28" width="10" height="10" rx="2" fill="#c2f04a"/>
    <rect x="36" y="28" width="10" height="10" rx="2" fill="#c2f04a"/>
    <rect x="21.5" y="31.5" width="3" height="3" rx="0.5" fill="#0b0d10"/>
    <rect x="39.5" y="31.5" width="3" height="3" rx="0.5" fill="#0b0d10"/>
    <path d="M16 48 Q20 44 24 48 T32 48 T40 48 T48 48" stroke="#6b2ce5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 56 Q56 60 60 58" stroke="#6ee7ff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="58" r="1.6" fill="#6ee7ff"/>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace" text-rendering="optimizeLegibility">
    <text x="540" y="300" font-size="168" font-weight="700" fill="#e8e6df" letter-spacing="-2">seqbaby</text>
    <text x="540" y="360" font-size="34" font-weight="500" fill="#c2f04a">prompt-driven step sequencer</text>
    <text x="540" y="402" font-size="22" fill="#8a8c93">plaits · 808 / 909 / 303 · samples · eleven-labs · midi</text>
  </g>

  <!-- accent step row — classic 4/4 downbeats lit up -->
  <g transform="translate(540 470)">
    <rect x="0"   y="0" width="44" height="44" rx="5" fill="#c2f04a"/>
    <rect x="52"  y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
    <rect x="104" y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
    <rect x="156" y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
    <rect x="208" y="0" width="44" height="44" rx="5" fill="#c2f04a"/>
    <rect x="260" y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
    <rect x="312" y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
    <rect x="364" y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
    <rect x="416" y="0" width="44" height="44" rx="5" fill="#c2f04a"/>
    <rect x="468" y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
    <rect x="520" y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
    <rect x="572" y="0" width="44" height="44" rx="5" fill="#2a2e38"/>
  </g>

  <!-- bottom-right patch-cable flourish -->
  <g fill="none" stroke="#6ee7ff" stroke-width="4" stroke-linecap="round">
    <path d="M1100 560 Q1060 600 1140 610"/>
  </g>
  <circle cx="1140" cy="610" r="6" fill="#6ee7ff"/>
</svg>
